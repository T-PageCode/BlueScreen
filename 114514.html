<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>114514</title>
    <style>
        *{
            margin: 0;
        }
        h1{
            position: absolute;
            top: calc(50% - 35px);
            left: 50%;
            transform: translate(-50%,-50%);
            font-weight: 200;
            font-size: 80px;
        }
        p{
            position: absolute;
            top: calc(50% + 35px);
            left: 50%;
            transform: translate(-50%,-50%);
            font-weight: 200;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1>114514</h1>
    <p>你被骗了</p>
</body>
</html>
