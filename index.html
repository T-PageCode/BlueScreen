<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
    <title>BlueScreen</title>
</head>
<body>
    <h1 id="bluescreen">
        <span id="font1">B</span>
        <span id="font2">l</span>
        <span id="font3">u</span>
        <span id="font4">e</span>
        <span id="font5">S</span>
        <span id="font6">c</span>
        <span id="font7">r</span>
        <span id="font8">e</span>
        <span id="font9">e</span>
        <span id="font10">n</span>
    </h1>
    <div id="select-color">
        <p>请选择蓝屏颜色</p>
        <input type="color" value="#0050ff">
    </div>
    <button id="start">开始</button>
    <script>
        localStorage.setItem("bluescreen-color", "#0050ff");
        document.addEventListener("input", () => {
            localStorage.setItem("bluescreen-color", document.querySelector("input").value);
        })
        document.getElementById("start").onclick = () => {
            window.location.href = "/screen.html";
        }
    </script>
</body>
</html>
