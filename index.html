<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>:(</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }
        body {
            background-color: #2067B2;
            user-select: none;
            -moz-user-select: none;
            padding: 8vh 0 0 8vw;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        * {
            color: white;
            font-weight: 300;
            white-space: nowrap;
            margin: 0;
        }
        #text1 {
            font-size: 10vw;
            line-height: 1;
            margin-bottom: 8vh;
            font-weight: 200;
        }
        #text2 {
            font-size: 1.8vw;
            line-height: 1.4;
            font-weight: 300;
        }
        #text3 {
            font-size: 1.8vw;
            margin-top: 6vh;
            font-weight: 300;
        }
        #text4 {
            font-size: 1.4vw;
            line-height: 1.4;
            margin-top: 8vh;
            font-weight: 300;
        }
        #text5 {
            font-size: 1.4vw;
            line-height: 1.4;
            margin-top: 4vh;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <h1 id="text1">:(</h1>
    <h1 id="text2">你的电脑遇到问题，需要重新启动。<br>我们只收集某些错误信息，然后为你重新启动。</h1>
    <h1 id="text3">0% 完成</h1>
    <p id="text4">有关此问题的详细信息和可能的解决方法，请访问：<br><a>https://windows.com/stopcode</a></p>
    <p id="text5">如果致电支持人员，请向他们提供以下信息：<br>错误代码：YOU_MAY_NOT_BE_ABLE_TO_WRITE_FRONT_END_CODE</p>
    <script>
        document.addEventListener("contextmenu", (e) => {
            e.preventDefault();
        })
        let i = 0;
        function timer() {
            setTimeout(() => {
                i += 1;
                document.getElementById("text3").innerText = `${i}% 完成`;
                if (i < 100) {
                    timer();
                }
                else {
                    setTimeout(() => {
                        document.body.innerHTML = "<img src='./icon.png' draggable='false' style='position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);height:250px;filter:brightness(1.5);'>";
                        document.body.style.backgroundColor = "black";
                        setTimeout(() => {
                            location.href = "index.html";
                        }, 4000)
                    }, 1000)
                }
            }, 100);
        }
        timer();
        document.querySelector("a").onclick = () => {
            window.open("114514.html");
        }
    </script>
</body>
</html>
