<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>:(</title>
    <style>
        body{
            background-color: rgb(0,100,255)
        }
        *{
            color: white;
            font-weight: 400;
            white-space: nowrap;
        }
        #text1{
            position: absolute;
            top: 150px;
            left: calc(50% - 350px);
            transform: translate(-50%,-50%);
            font-size: 150px;
        }
        #text2{
            position: absolute;
            top: 400px;
            left: calc(50% - 68px);
            transform: translate(-50%,-50%);
            font-size: 30px;
        }
        #text3{
            position: absolute;
            top: 480px;
            left: calc(50% - 315px);
            transform: translate(-50%,-50%);
            font-size: 30px;
        }
        #text4{
            position: absolute;
            top: 580px;
            left: calc(50% - 95px);
            transform: translate(-50%,-50%);
            font-size: 25px;
        }
        #text5{
            position: absolute;
            top: 660px;
            left: calc(50% - 132px);
            transform: translate(-50%,-50%);
            font-size: 25px;
        }
        img{
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%,-50%);
            height: 250px;
            filter: brightness(1.5);
        }
    </style>
</head>
<body>
    <h1 id="text1">:(</h1>
    <h1 id="text2">你的电脑遇到问题，需要重新启动。<br>我们只收集某些错误信息，然后为你重新启动。</h1>
    <h1 id="text3">0% 完成</h1>
    <p id="text4">有关此问题的详细信息和可能的解决方法，请访问：<br>https://windows.com/stopcode</p>
    <p id="text5">如果致电支持人员，请向他们提供以下信息：<br>错误代码：CRITICAL_PROCESS_DIED</p>
    <script>
        let i = 0;
        function timer() {
            setTimeout(() => {
                i += 1;
                console.log(i); 
                document.getElementById("text3").innerText = `${i}% 完成`;
                if (i < 100) {
                    timer();
                }
                else {
                    setTimeout(() => {
                        document.body.innerHTML = "<img src='./icon.png'>";
                        document.body.style.backgroundColor = "black";
                        setTimeout(() => {
                            location.href="index.html";
                        },3000)
                    },1000)
                }
            },100);
        }
        timer();
    </script>
</body>
</html>
